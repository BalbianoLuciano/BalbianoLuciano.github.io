<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridwright — carousel</title>
<!-- Visor para compartir. Muestra las slides ya renderizadas (slides/, 2160x2700),
     que son exactamente las paginas del PDF: no depende de ninguna fuente web.
     carrusel.html sigue siendo la fuente que se edita y se vuelve a renderizar. -->
<style>
  html, body { margin: 0; background: #2a2824; color: #c6c2b8; }
  body { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  header { max-width: 1080px; margin: 0 auto; padding: 32px 20px 8px; display: flex;
           justify-content: space-between; gap: 16px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
  a { color: #c6c2b8; }
  main { max-width: 1080px; margin: 0 auto; padding: 16px 20px 64px; display: grid; gap: 32px; }
  img { display: block; width: 100%; height: auto; outline: 1px solid rgba(0,0,0,.4); }
</style>
</head>
<body>
<header><span>Gridwright · 9 slides · 1080 × 1350</span><a href="gridwright-carrusel.pdf">PDF</a></header>
<main>
  <img src="slides/slide-01.png" alt="Introducing Gridwright — 98.54% fidelity at 1440px, a whole landing page, 12 sections, one command">
  <img src="slides/slide-02.png" alt="A prompt is a suggestion">
  <img src="slides/slide-03.png" alt="Claude doesn't pick the next step. It asks.">
  <img src="slides/slide-04.png" alt="The Figma, then what it built">
  <img src="slides/slide-05.png" alt="Twelve sections. Twelve agents.">
  <img src="slides/slide-06.png" alt="80 values in the design. 65 were already there.">
  <img src="slides/slide-07.png" alt="99.8% against 89%">
  <img src="slides/slide-08.png" alt="The score didn't see the typeface">
  <img src="slides/slide-09.png" alt="Responsive is next">
</main>
</body>
</html>
