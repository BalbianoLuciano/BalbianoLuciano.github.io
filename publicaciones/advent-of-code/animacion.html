<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Advent of Code · día 10 — animación</title>
<!-- El video del post: la misma maquina inventada del carrusel, resolviendose.
     render(t) dibuja el cuadro del segundo t sin estado previo, asi render.mjs
     captura cuadro por cuadro a 30 fps y el resultado es siempre el mismo.
     En el navegador corre sola en loop para revisarla. -->
<link rel="stylesheet" href="https://use.typekit.net/tyi0xxl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=block">
<style>
  @font-face { font-family: 'Aileron'; src: url('fonts/aileron-black.woff2') format('woff2'); font-weight: 900; }
  :root {
    --hormigon: #a8a49b; --sombra: #55524c; --vacio: #15130f; --baranda: #2f5568;
    --m: 90px; --linea: rgba(21, 19, 15, 0.34);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #2a2824; }
  #cuadro {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background: var(--hormigon); color: var(--vacio); padding: var(--m);
    display: flex; flex-direction: column; gap: 30px;
  }
  #cuadro::before {
    content: ''; position: absolute; inset: var(--m); z-index: 0;
    background-image: radial-gradient(circle at center, rgba(21,19,15,0.22) 0 2.5px, transparent 2.7px);
    background-size: var(--m) var(--m);
  }
  #cuadro > * { position: relative; z-index: 1; background: var(--hormigon);
                padding: 10px 16px; margin-left: -16px; margin-right: -16px; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-size: 24px; line-height: 1.5; margin: 0; }
  .etiqueta { text-transform: uppercase; letter-spacing: 0.14em; color: var(--sombra); }
  .titular { font-family: 'dharma-gothic-e', 'Aileron', sans-serif; font-weight: 700;
             line-height: 0.86; font-size: 108px; margin: 0; }
  .c32 { font-family: 'Outfit', sans-serif; font-size: 32px; line-height: 1.42; margin: 0; }
  .d48 { font-family: 'Outfit', sans-serif; font-size: 48px; line-height: 1.18; font-weight: 500; margin: 0; }
  .baranda { color: var(--baranda); }

  .maquina { border: 1px solid var(--vacio); padding: 30px 28px !important; margin: 0 !important;
             display: grid; gap: 30px; }
  .luces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; height: 190px; align-items: center; }
  .luz { display: grid; justify-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 24px; }
  .luz i { width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--vacio); display: block; }
  .luz.on i { background: var(--vacio); box-shadow: inset 0 0 0 12px var(--hormigon); }
  .luz.meta i { outline: 3px dashed var(--sombra); outline-offset: 8px; }
  .luces.bien .luz i { border-color: var(--baranda); }
  .luces.bien .luz.on i { background: var(--baranda); }
  .contador { display: grid; justify-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 24px; }
  .contador b { font-family: 'dharma-gothic-e', 'Aileron', sans-serif; font-weight: 700; font-size: 132px; line-height: 0.9; }
  .contador small { font-size: 26px; color: var(--sombra); }
  .contador.listo b, .contador.listo small { color: var(--baranda); }
  .botones { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .boton { border: 1px solid var(--vacio); padding: 14px 6px; text-align: center;
           font-family: 'IBM Plex Mono', monospace; font-size: 22px; line-height: 1.3; }
  .boton b { display: block; font-family: 'dharma-gothic-e', 'Aileron', sans-serif; font-size: 64px; line-height: 0.95; font-weight: 700; }
  .boton.si { background: var(--vacio); color: var(--hormigon); }
  .boton.pulso { background: var(--baranda); border-color: var(--baranda); color: var(--hormigon); }
  .boton .veces { display: block; min-height: 30px; font-size: 24px; }

  .ecuaciones { font-family: 'IBM Plex Mono', monospace; font-size: 34px; line-height: 1.55;
                border: 1px solid var(--vacio); padding: 20px 28px !important; margin: 0 !important; }
  .ecuaciones div { opacity: 0; }
  .ecuaciones span { color: var(--sombra); }
  .estado { min-height: 120px; }
  .pie { margin-top: auto !important; display: flex; justify-content: space-between;
         font-family: 'IBM Plex Mono', monospace; font-size: 24px; letter-spacing: 0.14em;
         text-transform: uppercase; color: var(--sombra);
         border-top: 1px solid var(--linea); padding-top: 18px !important; }
  .oculto { display: none !important; }
</style>
</head>
<body>
<div id="cuadro">
  <p class="mono etiqueta" id="etiqueta"></p>
  <h1 class="titular" id="titular"></h1>
  <div class="maquina">
    <div class="luces" id="luces"></div>
    <div class="botones" id="botones"></div>
  </div>
  <div class="ecuaciones oculto" id="ecuaciones">
    <div>C + E = 4 &nbsp;<span>· contador 0</span></div>
    <div>B + D = 4 &nbsp;<span>· contador 1</span></div>
    <div>A + B + E = 5 &nbsp;<span>· contador 2</span></div>
    <div>C = 4 &nbsp;<span>· contador 3</span></div>
    <div><span>enteros ≥ 0 · minimizar la suma</span></div>
  </div>
  <div class="estado" id="estado"></div>
  <p class="pie"><span>Luciano Balbiano</span><span>Advent of Code 2025</span></p>
</div>

<script>
  const BOTONES = [['A', [2]], ['B', [1, 2]], ['C', [0, 3]], ['D', [1]], ['E', [0, 2]]];
  const META_LUCES = [0, 0, 1, 1];
  const META = [4, 4, 5, 4];
  // El minimo de la parte 2 (de 5 soluciones posibles), en el orden en que se aprieta
  const PULSOS = [0, 1, 1, 1, 1, 2, 2, 2, 2];
  const DURACION = 24;

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Math.round(n).toLocaleString('es-AR');

  function luces(estado, bien) {
    $('luces').className = 'luces' + (bien ? ' bien' : '');
    $('luces').innerHTML = estado.map((on, i) =>
      `<div class="luz${on ? ' on' : ''}${META_LUCES[i] ? ' meta' : ''}"><i></i>${i}</div>`).join('');
  }
  function contadores(valores) {
    $('luces').className = 'luces';
    $('luces').innerHTML = valores.map((v, i) =>
      `<div class="contador${v === META[i] ? ' listo' : ''}"><b>${v}</b><small>de ${META[i]}</small></div>`).join('');
  }
  function botones(clases, veces) {
    $('botones').innerHTML = BOTONES.map(([n, ls], i) =>
      `<div class="boton ${clases[i] || ''}"><b>${n}</b>${ls.join(' · ')}`
      + (veces ? `<span class="veces">${veces[i] ? '×' + veces[i] : ''}</span>` : '') + '</div>').join('');
  }
  function aplicar(mascara) {
    const s = [0, 0, 0, 0];
    BOTONES.forEach(([, ls], i) => { if (mascara >> i & 1) ls.forEach((l) => { s[l] ^= 1; }); });
    return s;
  }
  const igual = (a, b) => a.every((v, i) => v === b[i]);
  const bits = (m) => [...m.toString(2)].filter((c) => c === '1').length;

  function render(t) {
    $('ecuaciones').classList.add('oculto');
    $('botones').classList.remove('oculto');
    if (t < 8) {
      // Parte 1: las 32 combinaciones, una por una
      $('etiqueta').textContent = 'Día 10 · parte 1';
      $('titular').textContent = 'Cada botón invierte luces';
      const k = t < 1.5 ? -1 : Math.min(31, Math.floor((t - 1.5) / (5 / 32)));
      if (k < 0) {
        luces([0, 0, 0, 0]); botones([]);
        $('estado').innerHTML = '<p class="d48">Meta: prender la 2 y la 3<br>con la menor cantidad de botones.</p>';
        return;
      }
      if (t >= 6.5) {
        luces(aplicar(0b10100), true); botones(['', '', 'pulso', '', 'pulso']);
        $('estado').innerHTML = '<p class="d48 baranda">C + E · 2 pulsaciones</p><p class="c32">32 combinaciones probadas. Fuerza bruta alcanza.</p>';
        return;
      }
      const s = aplicar(k), ok = igual(s, META_LUCES);
      luces(s, ok);
      botones(BOTONES.map((_, i) => (k >> i & 1 ? (ok ? 'pulso' : 'si') : '')));
      $('estado').innerHTML = `<p class="d48">combinación ${k + 1} de 32</p>`
        + `<p class="c32">${ok ? `sirve, con ${bits(k)} pulsaciones` : '&nbsp;'}</p>`;
      return;
    }

    $('etiqueta').textContent = 'Día 10 · parte 2';
    if (t < 9.5) {
      $('titular').textContent = 'Ahora los botones suman';
      contadores([0, 0, 0, 0]); botones([], [0, 0, 0, 0, 0]);
      $('estado').innerHTML = '<p class="d48">Cada contador tiene que llegar<br>a su número exacto.</p>';
      return;
    }
    if (t < 12.5) {
      // La fuerza bruta deja de existir: el contador de combinaciones no llega nunca
      $('titular').textContent = '¿Fuerza bruta otra vez?';
      const f = Math.floor((t - 9.5) * 30);
      const ruido = (i) => (f * 7 + i * 13) % (META[i] + 3);
      contadores([0, 1, 2, 3].map(ruido)); botones([], [0, 1, 2, 3, 4].map((i) => (f * 3 + i * 5) % 6));
      const exp = Math.min(25, (t - 9.5) * 11);
      $('estado').innerHTML = `<p class="d48">probadas: ${fmt(Math.pow(10, Math.min(exp, 6)))}${exp > 6 ? '…' : ''}</p>`
        + `<p class="c32">${t > 10.6 ? 'Con 13 botones, como la peor máquina de mi input: unas 10<sup>25</sup> combinaciones.' : '&nbsp;'}</p>`;
      return;
    }
    if (t < 15.5) {
      $('titular').textContent = 'Es un sistema de ecuaciones';
      contadores([0, 0, 0, 0]); botones([], [0, 0, 0, 0, 0]);
      $('ecuaciones').classList.remove('oculto');
      $('botones').classList.add('oculto');
      [...$('ecuaciones').children].forEach((d, i) => { d.style.opacity = t >= 12.6 + i * 0.5 ? 1 : 0; });
      $('estado').innerHTML = t > 15 ? '<p class="c32">Cinco soluciones posibles, de 9 a 13 pulsaciones. Se busca la menor.</p>' : '';
      return;
    }

    // Se aprieta la solucion minima: A una vez, B cuatro, C cuatro
    $('titular').textContent = t < 21 ? 'La solución mínima' : '9 pulsaciones';
    const n = Math.min(PULSOS.length, Math.floor((t - 15.5) / 0.6) + 1);
    const veces = [0, 0, 0, 0, 0], valores = [0, 0, 0, 0];
    PULSOS.slice(0, n).forEach((b) => { veces[b]++; BOTONES[b][1].forEach((l) => { valores[l]++; }); });
    const fase = (t - 15.5) % 0.6;
    const activo = t < 21 && fase < 0.3 ? PULSOS[n - 1] : -1;
    contadores(valores);
    botones(BOTONES.map((_, i) => (i === activo ? 'pulso' : '')), veces);
    $('estado').innerHTML = t < 21
      ? `<p class="d48">pulsación ${n} de 9</p>`
      : '<p class="d48 baranda">A = 1 · B = 4 · C = 4</p><p class="c32">Python + scipy: las 193 máquinas en 1,4 s.</p>';
  }

  window.render = render;
  window.DURACION = DURACION;
  if (!navigator.webdriver) {
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % DURACION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else {
    render(0);
  }
</script>
</body>
</html>
